<!doctype html>
<!-- Throwaway, standalone review of the agreed Claude + Codex design.
     All data and interactions are simulated in memory. No native app or account access. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pacemark · Agreed design</title>
  <style>
    :root { color-scheme:light; --page:#f5f6f8; --ink:#252933; --muted:#727986; --line:#dfe3e9; --panel:#fafafcf7; --text:#25262b; --secondary:#777b83; --track:#171d321a; --blue:#007aff; --orange:#c47908; --red:#df303d; --green:#278442; --surface:#fff; --group:#00000006; --border:#00000016; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--ink); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    button,select,input { font:inherit; }
    button,a,select,input { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; }
    button:disabled,select:disabled { cursor:default; opacity:.45; }
    button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible { outline:3px solid #4285f4; outline-offset:3px; }
    .page { max-width:1080px; margin:0 auto; padding:28px 32px 32px; }
    .eyebrow { display:flex; align-items:center; gap:9px; font-size:10px; font-weight:650; letter-spacing:1.4px; text-transform:uppercase; color:#767d8c; }
    .app-mark { width:24px; height:24px; border-radius:7px; display:grid; place-items:center; background:#4857c8; color:white; }
    .app-mark svg { width:18px; height:18px; }
    .heading { margin-top:13px; display:flex; justify-content:space-between; align-items:center; gap:20px; }
    h1 { margin:0; font-size:29px; line-height:1.2; font-weight:650; letter-spacing:-.8px; }
    .intro { margin:8px 0 21px; color:var(--muted); font-size:13px; }
    .toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:9px; margin-bottom:10px; }
    .toolbar label { font-size:12px; font-weight:550; margin-right:2px; }
    .toolbar select,.outside-button { border:1px solid #d6dce5; border-radius:7px; background:white; color:#4c5463; padding:6px 10px; font-size:12px; height:32px; }
    .toolbar select { min-width:226px; }
    .toolbar .spacer { flex:1; }
    .sample-tag { color:#7a8190; font-size:11px; padding:0 5px; }
    .scenario-note { min-height:32px; margin:0 0 12px; color:#6d7583; font-size:12px; }
    .desktop { position:relative; min-height:520px; overflow:clip; border:1px solid #bec7d9; border-radius:12px; background:radial-gradient(ellipse at 5% 130%,#899ddb 0%,transparent 63%),radial-gradient(ellipse at 120% 10%,#d4bddf 0%,transparent 67%),linear-gradient(130deg,#b8cce6,#c7cce7 45%,#aab8dc); box-shadow:0 10px 30px #2637590b; }
    .desktop::before { content:""; pointer-events:none; position:absolute; width:730px; height:350px; bottom:-205px; right:-60px; border:1px solid #ffffff3d; border-radius:50%; transform:rotate(-27deg); box-shadow:0 -35px 0 #ffffff08,0 -78px 0 #ffffff08; }
    .menubar { position:relative; z-index:2; display:flex; align-items:center; height:33px; padding:0 16px; background:#e9ecf1a8; color:#242a37; border-bottom:1px solid #5f70931b; }
    .menu-left { display:flex; align-items:center; gap:17px; font-size:12px; }
    .menu-left strong { font-weight:650; }
    .apple { width:12px; height:15px; }
    .menu-right { margin-left:auto; display:flex; align-items:center; gap:13px; }
    .menu-item { height:26px; min-width:29px; border:0; border-radius:5px; padding:0 6px; display:flex; align-items:center; gap:4px; background:transparent; color:inherit; font-size:13px; font-weight:500; font-variant-numeric:tabular-nums; }
    .menu-item[aria-expanded="true"] { background:#20274018; }
    .menu-item.stale .menu-value,.menu-item.stale .gauge { opacity:.45; }
    .menu-item.high .menu-value { color:var(--red); }
    .menu-item.high.glyph-only .gauge { color:var(--red); }
    .gauge { width:17px; height:17px; display:block; }
    .warning-icon { width:17px; height:17px; display:block; }
    .system-tray { display:flex; align-items:center; gap:11px; font-size:11px; font-weight:500; }
    .system-tray svg { width:15px; height:15px; }
    .dropdown { position:absolute; z-index:3; top:40px; right:82px; width:300px; background:var(--panel); color:var(--text); border:1px solid #ffffffb8; border-radius:10px; box-shadow:0 10px 28px #26345730,0 0 0 .5px #2e35421c; overflow:hidden; }
    .tabs { display:flex; height:27px; margin:12px 14px 15px; padding:2px; border-radius:6px; background:#5354671a; }
    .tab { flex:1; padding:0; border:0; border-radius:4px; background:transparent; color:inherit; font-size:12px; line-height:21px; }
    .tab[aria-selected="true"] { background:var(--surface); box-shadow:0 1px 3px #00000019; font-weight:600; }
    .rows { padding:0 14px 12px; display:grid; gap:13px; max-height:368px; overflow:auto; }
    .limit { display:grid; gap:4px; }
    .limit-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; line-height:18px; font-weight:600; }
    .limit-heading .title { min-width:0; }
    .percent { font-variant-numeric:tabular-nums; flex-shrink:0; }
    .bar-space { height:12px; display:flex; align-items:center; }
    .track { position:relative; height:6px; width:100%; border-radius:6px; background:var(--track); }
    .fill { width:var(--used); height:100%; border-radius:6px; background:var(--fill); }
    .pace-marker { position:absolute; left:var(--pace); top:-3px; width:2px; height:12px; background:var(--text); box-shadow:0 0 0 1.5px #f8f8fa; }
    .limit-detail { display:flex; justify-content:space-between; gap:5px; font-size:11px; line-height:15px; color:var(--secondary); }
    .pace-under { color:var(--green); }
    .pace-over { color:var(--orange); }
    .pace-high { color:var(--red); }
    .provider-status { margin-top:5px; color:var(--secondary); font-size:11px; line-height:15px; }
    .provider-message { margin:4px 0 0; color:var(--secondary); font-size:12px; line-height:17px; }
    .details-button { border:0; padding:0; background:transparent; color:var(--blue); font-size:11px; font-weight:400; }
    .loading-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--secondary); margin-right:5px; opacity:.55; }
    .empty { margin:0; font-size:12px; line-height:18px; color:var(--secondary); }
    .empty strong { display:block; color:var(--text); font-size:13px; margin-bottom:3px; font-weight:600; }
    .problem-title { margin:0 0 5px; font-size:13px; line-height:18px; font-weight:600; }
    .problem-copy { margin:0; font-size:13px; line-height:19px; color:var(--secondary); }
    .problem-copy p { margin:0 0 9px; }
    .problem-copy p:last-child { margin-bottom:0; }
    code { font:11px ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--track); padding:2px 4px; border-radius:3px; color:var(--text); }
    .problem-link { display:inline-block; margin-top:10px; font-size:12px; color:var(--blue); text-decoration:none; }
    .footer { padding:8px 14px 9px; border-top:1px solid var(--border); font-size:11px; color:var(--secondary); }
    .footer .provider-status { margin:0 0 8px; }
    .footer-actions { display:flex; justify-content:flex-end; gap:13px; }
    .text-button { border:0; padding:0; background:transparent; color:inherit; font-size:12px; }
    .desktop-caption { position:absolute; left:18px; bottom:14px; color:#35436b93; font-size:10px; }
    .settings-window { position:absolute; z-index:5; width:440px; max-width:calc(100% - 28px); top:47px; left:50%; transform:translateX(-50%); color:var(--text); background:var(--panel); border:1px solid #ffffff94; border-radius:10px; box-shadow:0 20px 55px #25345840,0 0 0 .5px #0002; overflow:hidden; }
    .window-titlebar { height:43px; display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--border); background:var(--group); font-size:13px; font-weight:600; position:relative; }
    .traffic { position:absolute; left:13px; display:flex; gap:8px; }
    .traffic button,.traffic i { width:12px; height:12px; border-radius:50%; border:1px solid #00000012; padding:0; display:block; }
    .traffic button { background:#ff6057; }
    .traffic i:nth-child(2) { background:#febc2e; }
    .traffic i:nth-child(3) { background:#28c840; }
    .settings-body { max-height:369px; overflow:auto; padding:14px 19px 17px; }
    .settings-section { margin:0 0 17px; }
    .settings-section:last-child { margin-bottom:0; }
    .section-title { margin:0 0 6px 2px; font-size:11px; font-weight:600; color:var(--secondary); }
    .settings-group { border:1px solid var(--border); border-radius:7px; background:var(--group); overflow:hidden; }
    .setting-row { min-height:35px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 10px; font-size:12px; }
    .setting-row + .setting-row { border-top:1px solid var(--border); }
    .setting-row label { min-width:0; }
    .setting-row select { min-width:96px; max-width:259px; font-size:11px; padding:3px 5px; border:1px solid var(--border); border-radius:5px; background:var(--surface); color:var(--text); }
    .setting-help { margin:6px 2px 0; color:var(--secondary); font-size:11px; line-height:15px; }
    .provider-subtitle { color:var(--secondary); font-size:11px; margin:10px 2px 5px; font-weight:600; }
    .switch { position:relative; flex-shrink:0; width:30px; height:18px; padding:2px; border:0; border-radius:10px; background:#989ba5; }
    .switch[aria-checked="true"] { background:var(--blue); }
    .switch::after { content:""; display:block; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 1px 2px #0002; }
    .switch[aria-checked="true"]::after { transform:translateX(12px); }
    .visibility-box { width:14px; height:14px; margin:0; accent-color:var(--blue); cursor:pointer; flex-shrink:0; }
    .settings-footer { display:flex; align-items:center; justify-content:space-between; padding:9px 19px; border-top:1px solid var(--border); font-size:10px; color:var(--secondary); }
    .state-strip { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; padding:15px 2px 13px; border-bottom:1px solid var(--line); font-size:12px; }
    .state-label { display:block; color:#7d8490; font-size:11px; margin-bottom:3px; }
    .state-value { color:#424b5b; font-weight:550; }
    .review-hint { display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-top:12px; color:#78818e; font-size:11px; }
    .review-hint a { color:inherit; text-decoration:none; border-bottom:1px solid #c8ced8; }
    [data-dark="true"] { color-scheme:dark; --panel:#282a31fa; --text:#eeeff4; --secondary:#b0b2bd; --track:#ffffff22; --green:#60c57e; --orange:#fbb65b; --red:#ff6268; --surface:#666872; --group:#00000019; --border:#ffffff16; }
    [data-dark="true"] .desktop { background:radial-gradient(ellipse at 5% 130%,#4e639e 0%,transparent 63%),radial-gradient(ellipse at 120% 10%,#64567c 0%,transparent 67%),linear-gradient(130deg,#2b354f,#343651 45%,#333e69); border-color:#4b5471; }
    [data-dark="true"] .menubar { background:#252a3da8; color:#fff; }
    [data-dark="true"] .menu-item[aria-expanded="true"] { background:#ffffff20; }
    [data-dark="true"] .dropdown,[data-dark="true"] .settings-window { border-color:#ffffff20; }
    [data-dark="true"] .tabs { background:#00000026; }
    [data-dark="true"] .pace-marker { box-shadow:0 0 0 1.5px #292b32; }
    [data-dark="true"] .desktop-caption { color:#ffffff70; }
    [data-dark="true"] .toolbar select,[data-dark="true"] .outside-button { color-scheme:light; }
    @media(max-width:700px) { .page { padding:20px 18px; } h1 { font-size:25px; } .menu-left span { display:none; } .desktop { min-height:520px; } .dropdown { right:30px; } .state-strip { gap:12px; grid-template-columns:1fr 1fr; } .state-strip>div:last-child { grid-column:1/-1; } .sample-tag { display:none; } }
    @media(max-width:420px) { .page { padding:17px 10px; } .dropdown { right:calc(50% - 150px); } .menu-left { display:none; } .toolbar { gap:6px; } .toolbar select { min-width:0; flex:1; } .toolbar label { width:100%; } .toolbar .spacer { display:none; } .settings-body { padding:12px; } .setting-row select { max-width:220px; } .heading { gap:8px; } h1 { font-size:23px; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="eyebrow"><span class="app-mark" id="app-mark"></span>Pacemark <span style="opacity:.45">/</span> Design review</div>
    <div class="heading"><h1>Claude & Codex. One overview.</h1></div>
    <p class="intro">The agreed design, ready to click through. All values are sample data.</p>
    <div class="toolbar" aria-label="Prototype controls">
      <label for="scenario">Scenario</label><select id="scenario" aria-label="Scenario"></select>
      <button class="outside-button" id="reset-demo">Reset demo</button><span class="spacer"></span>
      <button class="outside-button" id="appearance">Dark appearance</button><span class="sample-tag">Interactive prototype</span>
    </div>
    <p class="scenario-note" id="scenario-note"></p>
    <section class="desktop" id="desktop" aria-label="Pacemark app preview"></section>
    <div class="state-strip" id="state-strip" aria-label="Prototype state"></div>
    <div class="review-hint"><span>Try the tabs, Settings, and closing and reopening the menu bar item.</span><a href="index.html?variant=all">Earlier concepts ↗</a></div>
  </main>
  <script>
    const gauge = '<svg class="gauge" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" aria-hidden="true"><path d="M4 16a8 8 0 1 1 12 0H4Z"/><path d="M10 3v2M4.4 5.5 6 7M2.3 11h2.1M15.6 11h2.1M10 11.2l3.3-4.4"/><circle cx="10" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>';
    const warning = '<svg class="warning-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m10 2 8 15H2L10 2Z"/><path d="M10 7v4M10 14v.2"/></svg>';
    const tray = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 7a12 12 0 0 1 16 0M5 10a8 8 0 0 1 10 0M8 13a3 3 0 0 1 4 0"/><circle cx="10" cy="16" r=".5" fill="currentColor"/></svg><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2" y="3" width="16" height="5" rx="2.5"/><circle cx="6" cy="5.5" r="1.2" fill="currentColor"/><rect x="2" y="12" width="16" height="5" rx="2.5"/><circle cx="14" cy="14.5" r="1.2" fill="currentColor"/></svg><span>Tue 15:42</span>';
    const names = {overview:'Overview',claude:'Claude',codex:'Codex'};
    const providerOrder = ['claude','codex'];
    const fixtures = {
      everyday: {label:'Everyday use',note:'Both providers are enabled. Overview compares general weekly limits; the menu bar stays on Claude’s Session limit.'},
      fresh: {label:'First launch',note:'A fresh installation starts with no providers enabled. Open Settings to choose a provider; its first available limit is selected automatically.'},
      upgrade: {label:'Upgrade with saved settings',note:'Existing saved settings keep Claude enabled, Codex disabled, and the previous limit selection, refresh interval, and hidden limits.'},
      hidden: {label:'Weekly limit hidden in its tab',note:'Claude’s Weekly limit is hidden in its provider tab. It stays visible in Overview and remains selected in the menu bar.'},
      disabled: {label:'Pinned provider disabled',note:'The saved selection is Codex’s Weekly limit, but Codex is disabled. Re-enable Codex in Settings to restore the percentage.'},
      'sign-in': {label:'Codex sign-in required',note:'Codex needs its existing CLI login restored. Details opens the Codex tab with instructions. Claude continues to show its limits.'},
      'missing-cli': {label:'Codex not installed',note:'An enabled provider can need setup. Overview shows a short message; the provider tab contains the full instructions.'},
      loading: {label:'Codex still loading',note:'Claude’s limits are ready while Codex is loading. Each provider has its own state.'},
      unavailable: {label:'Codex unavailable, no data yet',note:'Codex has not loaded any values yet and a refresh failed. Claude stays usable; Codex will retry.'},
      stale: {label:'Codex values out of date',note:'Codex last updated 20 minutes ago. Its current window is still valid, so the last values remain with a warning and a dimmed menu bar percentage.'},
      'no-weekly': {label:'No general weekly limit',note:'Codex reports a shorter limit and a model limit, but no general weekly limit. Overview keeps a Codex placeholder.'},
      'no-reset': {label:'Reset time unavailable',note:'Codex reports 42% weekly utilization without a reset time. Its bar stays visible; the pace marker and pace text are omitted.'},
      expired: {label:'Codex window expired',note:'The saved Codex Weekly limit has passed its reset time, and the next refresh failed. Its old percentage is hidden until current data arrives.'}
    };
    let scenario = new URLSearchParams(location.search).get('scenario') || 'everyday';
    if (!fixtures[scenario]) scenario = 'everyday';
    let dark = false;
    let state;

    function makeState() {
      return {
        open:true,tab:'overview',settings:false,enabled:['claude','codex'],pin:'claude/session',pinTitle:'Claude · Session limit',hidden:[],showPercentage:true,refresh:5,openAtLogin:false,
        providers:{
          claude:{kind:'ready',age:'Updated just now',stale:false,limits:[
            {id:'session',title:'Session limit',used:71,pace:63,reset:'Resets in 1 hr 52 min'},
            {id:'weekly',title:'Weekly limit',generalWeekly:true,used:63,pace:63,reset:'Resets Wed 03:00'},
            {id:'model:fable',title:'Fable limit',used:22,pace:63,reset:'Resets Wed 03:00'}
          ]},
          codex:{kind:'ready',age:'Updated 2 min ago',stale:false,limits:[
            {id:'short',title:'5-hour limit',used:38,pace:51,reset:'Resets in 2 hr 27 min'},
            {id:'weekly',title:'Weekly limit',generalWeekly:true,used:20,pace:35,reset:'Resets Fri 15:00'},
            {id:'model:example',title:'Example model limit',used:56,pace:35,reset:'Resets Fri 15:00'}
          ]}
        }
      };
    }
    function selectPin(provider,limit) {
      state.pin = `${provider}/${limit.id}`;
      state.pinTitle = `${names[provider]} · ${limit.title}`;
    }
    function resetScenario(next) {
      scenario = next;
      state = makeState();
      const codex = state.providers.codex;
      if (next === 'fresh') { state.enabled=[]; state.pin=null; state.pinTitle=null; }
      if (next === 'upgrade') { state.enabled=['claude']; selectPin('claude',state.providers.claude.limits[1]); state.hidden=['claude/model:fable']; state.refresh=10; }
      if (next === 'hidden') { state.hidden=['claude/weekly']; selectPin('claude',state.providers.claude.limits[1]); }
      if (['disabled','sign-in','stale','no-reset','expired','loading','unavailable'].includes(next)) selectPin('codex',codex.limits[1]);
      if (next === 'disabled') state.enabled=['claude'];
      if (next === 'sign-in') {
        Object.assign(codex,{kind:'problem',short:'Sign-in required',heading:'Codex sign-in required',message:'<p>Open Terminal and run <code>codex login</code>. Sign in with your ChatGPT account.</p><p>Pacemark will use that login on its next refresh.</p>',link:'https://learn.chatgpt.com/docs/auth',linkTitle:'Codex sign-in help',limits:[],age:null});
      }
      if (next === 'missing-cli') {
        Object.assign(codex,{kind:'problem',short:'Codex not installed',heading:'Install Codex to view your limits',message:'<p>Install the Codex command-line tool, then sign in with your ChatGPT account.</p><p>Pacemark will detect it on its next refresh.</p>',link:'https://learn.chatgpt.com/docs/cli',linkTitle:'Codex CLI documentation',limits:[],age:null});
      }
      if (next === 'loading') Object.assign(codex,{kind:'loading',limits:[],age:null});
      if (next === 'unavailable') Object.assign(codex,{kind:'unavailable',limits:[],age:null});
      if (next === 'stale' || next === 'expired') Object.assign(codex,{stale:true,age:"Couldn't update · Last update 20 min ago"});
      if (next === 'no-weekly') codex.limits = codex.limits.filter(limit=>!limit.generalWeekly);
      if (next === 'no-reset') Object.assign(codex.limits[1],{used:42,pace:null,reset:null});
      if (next === 'expired') Object.assign(codex.limits[1],{expired:true});
      const url = new URL(location.href);
      url.searchParams.set('scenario',next);
      history.replaceState(null,'',url);
      render();
    }
    function pinned() {
      if (!state.pin) return {kind:'empty'};
      const [provider,...rest] = state.pin.split('/');
      const id = rest.join('/');
      if (!state.enabled.includes(provider)) return {kind:'disabled',provider};
      const data = state.providers[provider];
      if (data.kind === 'problem') return {kind:'problem',provider};
      const limit = data.limits.find(item=>item.id===id);
      if (!limit || limit.expired || data.kind !== 'ready') return {kind:'waiting',provider};
      return {kind:'value',provider,limit,stale:data.stale};
    }
    function percent(limit) { return Math.round(Math.min(100,Math.max(0,limit.used))); }
    function row(limit,title=limit.title) {
      if (limit.expired) return `<div class="limit expired-limit"><div class="limit-heading"><span>${title}</span></div><div class="limit-detail">Waiting for updated limits</div></div>`;
      const value = percent(limit), hasPace = Number.isFinite(limit.pace);
      const difference = hasPace ? Math.round(limit.used-limit.pace) : null;
      const color = value>=90 ? 'var(--red)' : difference>0 ? 'var(--orange)' : 'var(--blue)';
      const text = value===100 ? 'Limit reached' : difference===0 ? 'On pace' : `${Math.abs(difference)}% ${difference>0?'over':'under'} pace`;
      const paceClass = value===100 ? 'pace-high' : difference>0?'pace-over':difference<0?'pace-under':'';
      return `<div class="limit" data-limit="${limit.id}"><div class="limit-heading"><span class="title">${title}</span><span class="percent">${value}%</span></div><div class="bar-space"><div class="track" style="--used:${value}%;--pace:${hasPace?limit.pace:0}%;--fill:${color}"><div class="fill"></div>${hasPace?'<span class="pace-marker"></span>':''}</div></div><div class="limit-detail"><span>${limit.reset??'Reset time unavailable'}</span>${hasPace?`<span class="${paceClass}">${text}</span>`:''}</div></div>`;
    }
    function updateLine(provider) { const age=state.providers[provider].age; return age?`<div class="provider-status">${age}</div>`:''; }
    function overviewEntry(provider) {
      const data=state.providers[provider];
      let content;
      if (data.kind==='loading') content=`<div class="limit-heading"><span>${names[provider]}</span></div><p class="provider-message"><span class="loading-dot"></span>Loading…</p>`;
      else if (data.kind==='problem' || data.kind==='unavailable') content=`<div class="limit-heading"><span>${names[provider]}</span><button class="details-button" data-details="${provider}">Details</button></div><p class="provider-message">${data.kind==='problem'?data.short:"Can't load limits right now"}</p>`;
      else {
        const weekly=data.limits.find(limit=>limit.generalWeekly);
        content=weekly?row(weekly,`${names[provider]} · Weekly limit`):`<div class="limit-heading"><span>${names[provider]}</span></div><p class="provider-message">No weekly limit reported</p>`;
        content+=updateLine(provider);
      }
      return `<div class="provider-entry" data-provider="${provider}">${content}</div>`;
    }
    function providerContent(provider) {
      const data=state.providers[provider];
      if(data.kind==='loading') return '<p class="empty">Loading…</p>';
      if(data.kind==='problem') return `<div><h2 class="problem-title">${data.heading}</h2><div class="problem-copy">${data.message}</div><a class="problem-link" href="${data.link}" target="_blank" rel="noreferrer">${data.linkTitle} ↗</a></div>`;
      if(data.kind==='unavailable') return '<div><h2 class="problem-title">Can\'t load your limits right now</h2><p class="problem-copy">Trying again shortly.</p></div>';
      const visible=data.limits.filter(limit=>!state.hidden.includes(`${provider}/${limit.id}`));
      if(!visible.length) return `<p class="empty">${data.limits.length?'All limits are hidden.':'No usage limits reported.'}</p>`;
      return visible.map(limit=>row(limit)).join('');
    }
    function dropdown() {
      const tabs=['overview',...providerOrder.filter(provider=>state.enabled.includes(provider))];
      const content=state.tab==='overview'
        ? state.enabled.length?providerOrder.filter(provider=>state.enabled.includes(provider)).map(overviewEntry).join(''):'<p class="empty"><strong>Choose your providers</strong>Enable a provider in Settings to see its weekly limits.</p>'
        : providerContent(state.tab);
      return `<div class="dropdown"><div class="tabs" role="tablist" aria-label="Providers">${tabs.map(tab=>`<button class="tab" role="tab" aria-selected="${state.tab===tab}" data-tab="${tab}">${names[tab]}</button>`).join('')}</div><div class="rows" role="tabpanel" aria-label="${names[state.tab]} limits">${content}</div><div class="footer">${state.tab==='overview'?'':updateLine(state.tab)}<div class="footer-actions"><button class="text-button" data-action="settings">Settings…</button><button class="text-button" data-action="quit">Quit</button></div></div></div>`;
    }
    function toggle(label,checked,action,value='') { return `<button class="switch" role="switch" aria-label="${label}" aria-checked="${checked}" data-action="${action}" data-value="${value}"></button>`; }
    function settingsWindow() {
      const candidates=providerOrder.filter(provider=>state.enabled.includes(provider)&&state.providers[provider].kind==='ready').flatMap(provider=>state.providers[provider].limits.map(limit=>({value:`${provider}/${limit.id}`,label:`${names[provider]} · ${limit.title}`})));
      const isAvailable=candidates.some(option=>option.value===state.pin);
      const selection=pinned();
      const storedOption=!state.pin?'<option value="" disabled selected>No limit selected</option>':!isAvailable?`<option value="${state.pin}" disabled selected>${state.pinTitle} (${selection.kind==='disabled'?'disabled':'not available'})</option>`:'';
      const options=storedOption+candidates.map(option=>`<option value="${option.value}" ${state.pin===option.value?'selected':''}>${option.label}</option>`).join('');
      const visibility=providerOrder.filter(provider=>state.enabled.includes(provider)).map(provider=>{
        const limits=state.providers[provider].limits;
        return `<div class="provider-subtitle">${names[provider]}</div>${limits.length?`<div class="settings-group">${limits.map(limit=>{const id=`${provider}/${limit.id}`;return `<label class="setting-row"><span>${limit.title}</span><input class="visibility-box" type="checkbox" data-visible="${id}" aria-label="Show ${names[provider]} ${limit.title} in provider tab" ${state.hidden.includes(id)?'':'checked'}></label>`;}).join('')}</div>`:'<p class="setting-help">Limits appear here once they have loaded.</p>'}`;
      }).join('');
      return `<section class="settings-window" role="dialog" aria-label="Pacemark Settings"><div class="window-titlebar"><div class="traffic"><button data-action="close-settings" aria-label="Close Settings"></button><i></i><i></i></div>Pacemark Settings</div><div class="settings-body"><section class="settings-section"><h2 class="section-title">General</h2><div class="settings-group"><div class="setting-row"><span>Open at Login</span>${toggle('Open at Login',state.openAtLogin,'login')}</div><div class="setting-row"><label for="refresh">Refresh every</label><select id="refresh">${[5,10,15].map(value=>`<option value="${value}" ${state.refresh===value?'selected':''}>${value} min</option>`).join('')}</select></div></div></section><section class="settings-section"><h2 class="section-title">Providers</h2><div class="settings-group">${providerOrder.map(provider=>`<div class="setting-row"><span>${names[provider]}</span>${toggle(`Enable ${names[provider]}`,state.enabled.includes(provider),'provider',provider)}</div>`).join('')}</div><p class="setting-help">Use each provider’s installed command-line tool and existing login.</p></section><section class="settings-section"><h2 class="section-title">Menu Bar</h2><div class="settings-group"><div class="setting-row"><label for="pin">Limit</label><select id="pin" ${candidates.length?'':'disabled'}>${options}</select></div><div class="setting-row"><span>Show percentage</span>${toggle('Show percentage',state.showPercentage,'percentage')}</div></div><p class="setting-help">The selected limit stays fixed when you switch tabs.</p></section><section class="settings-section"><h2 class="section-title">Provider Tabs</h2><p class="setting-help">Choose which limits appear in each provider’s tab. Overview always includes every enabled provider’s weekly entry.</p>${visibility||'<p class="setting-help">Enable a provider to choose its visible limits.</p>'}</section></div><div class="settings-footer"><span>Pacemark · Design preview</span><button class="text-button" data-action="quit">Quit Pacemark</button></div></section>`;
    }
    function render() {
      const pin=pinned(),value=pin.kind==='value'?percent(pin.limit):null;
      const high=value!==null&&value>=90;
      const menu=pin.kind==='problem'?warning:gauge+(pin.kind==='value'&&state.showPercentage?`<span class="menu-value">${value}%</span>`:'');
      const menuDescription=pin.kind==='value'?`${state.pinTitle}, ${value}%${pin.stale?', not up to date':''}`:pin.kind==='problem'?`${names[pin.provider]} needs attention`:pin.kind==='disabled'?`${state.pinTitle}, provider disabled`:pin.kind==='waiting'?`${state.pinTitle}, waiting for data`:'No limit selected';
      document.body.dataset.dark=dark;
      document.getElementById('appearance').textContent=dark?'Light appearance':'Dark appearance';
      document.getElementById('scenario').value=scenario;
      document.getElementById('scenario-note').textContent=fixtures[scenario].note;
      document.getElementById('desktop').innerHTML=`<div class="menubar"><div class="menu-left"><strong>Finder</strong><span>File</span><span>Edit</span><span>View</span></div><div class="menu-right"><button class="menu-item ${pin.stale?'stale':''} ${high?'high':''} ${!state.showPercentage?'glyph-only':''}" data-action="menu" aria-label="Toggle Pacemark dropdown" aria-description="${menuDescription}" aria-expanded="${state.open}">${menu}</button><div class="system-tray">${tray}</div></div></div>${state.open?dropdown():''}${state.settings?settingsWindow():''}<div class="desktop-caption">macOS preview · sample data</div>`;
      const menuState=pin.kind==='value'?state.showPercentage?`${value}%${pin.stale?' · Out of date':''}`:'Gauge · Percentage hidden':pin.kind==='problem'?'Warning · Setup required':pin.kind==='disabled'?'Gauge · Provider disabled':pin.kind==='waiting'?'Gauge · Waiting for data':'Gauge · No limit selected';
      document.getElementById('state-strip').innerHTML=`<div><span class="state-label">Viewing</span><span class="state-value">${state.settings?'Settings':state.open?names[state.tab]:'Menu closed'}</span></div><div><span class="state-label">Saved menu bar limit</span><span class="state-value">${state.pinTitle??'None yet'}</span></div><div><span class="state-label">Menu bar</span><span class="state-value">${menuState}</span></div>`;
    }
    function preserveSettingsScroll(action) {
      const scroll=document.querySelector('.settings-body')?.scrollTop??0;
      action();render();
      const body=document.querySelector('.settings-body');if(body)body.scrollTop=scroll;
    }
    document.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button)return;
      if(button.id==='appearance'){dark=!dark;render();return;}
      if(button.id==='reset-demo'){resetScenario(scenario);return;}
      if(button.dataset.tab){state.tab=button.dataset.tab;render();return;}
      if(button.dataset.details){state.tab=button.dataset.details;render();return;}
      const action=button.dataset.action,value=button.dataset.value;
      if(action==='menu'){state.open=!state.open;if(state.open){state.tab='overview';state.settings=false;}render();return;}
      if(action==='settings'){state.open=false;state.settings=true;render();return;}
      if(action==='close-settings'){state.settings=false;render();return;}
      if(action==='quit'){state.open=false;state.settings=false;render();return;}
      preserveSettingsScroll(()=>{
        if(action==='provider'){
          if(state.enabled.includes(value)){state.enabled=state.enabled.filter(provider=>provider!==value);if(state.tab===value)state.tab='overview';}
          else {state.enabled.push(value);const first=state.providers[value].limits.find(limit=>!limit.expired);if(!state.pin&&state.providers[value].kind==='ready'&&first)selectPin(value,first);}
        }
        if(action==='percentage')state.showPercentage=!state.showPercentage;
        if(action==='login')state.openAtLogin=!state.openAtLogin;
      });
    });
    document.addEventListener('change',event=>{
      const target=event.target;
      if(target.id==='scenario'){resetScenario(target.value);return;}
      preserveSettingsScroll(()=>{
        if(target.id==='refresh')state.refresh=Number(target.value);
        if(target.id==='pin'){const [provider,...rest]=target.value.split('/');const limit=state.providers[provider].limits.find(item=>item.id===rest.join('/'));selectPin(provider,limit);}
        if(target.dataset.visible){const id=target.dataset.visible;state.hidden=target.checked?state.hidden.filter(hidden=>hidden!==id):[...state.hidden,id];}
      });
    });
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'){state.open=false;state.settings=false;render();}
    });
    window.addEventListener('popstate',()=>{const value=new URLSearchParams(location.search).get('scenario');resetScenario(fixtures[value]?value:'everyday');});
    document.getElementById('app-mark').innerHTML=gauge;
    document.getElementById('scenario').innerHTML=Object.entries(fixtures).map(([value,fixture])=>`<option value="${value}">${fixture.label}</option>`).join('');
    resetScenario(scenario);
  </script>
</body>
</html>
